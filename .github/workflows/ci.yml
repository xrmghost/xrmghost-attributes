name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore dependencies
        run: dotnet restore xrmghost-attributes.sln

      - name: Build solution
        run: dotnet build xrmghost-attributes.sln -c Release --no-restore

      # The net8.0 test project is present and gating: a failing test fails the build.
      - name: Run tests
        run: dotnet test xrmghost-attributes.sln --no-build --configuration Release
